[package]
name = "ppc"
version = "0.7.3"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "A safe Rust 32-bit PowerPC user-mode CPU interpreter"
repository = "https://github.com/benletchford/ppc-rs"
readme = "README.md"
keywords = ["powerpc", "ppc", "interpreter", "emulator"]
categories = ["emulators"]
documentation = "https://docs.rs/ppc"
publish = ["crates-io"]
exclude = [
    "/.github/**",
    "/.gitignore",
    "/.release-please-manifest.json",
    "/CONTRIBUTING.md",
    "/committed.toml",
    "/release-please-config.json",
    "/rust-toolchain.toml",
    "/tests/**",
]

[features]
trace-wasm = ["dep:wasm-encoder"]
# Cranelift baseline JIT. Contains `unsafe` code; the rest of the
# crate remains safe.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
]

[dependencies]
rustc_apfloat = "0.2.3"
wasm-encoder = { version = "0.262.0", optional = true }
cranelift-codegen = { version = "=0.132.0", optional = true }
cranelift-frontend = { version = "=0.132.0", optional = true }
cranelift-jit = { version = "=0.132.0", optional = true }
cranelift-module = { version = "=0.132.0", optional = true }

[dev-dependencies]
ieee-apsqrt = "0.1.1"
wasmparser = "0.262.0"

[[bench]]
name = "cached_blocks"
harness = false
